<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>生物医学工程就业全景思维导图 · 黑白 Canvas</title>
<style>
:root{color-scheme:light} *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#fff;color:#111;font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column} .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #222;background:#fff;flex:0 0 auto;z-index:2} .brand{font-size:15px;font-weight:700;margin-right:auto;white-space:nowrap} button,.search{font-family:inherit;font-size:13px;background:#fff;color:#111;border:1px solid #333;border-radius:3px;padding:8px 11px;cursor:pointer}.search{min-width:180px;flex:0 1 230px;cursor:text} button:hover{background:#eee}button.active{background:#111;color:#fff}button:focus-visible,.search:focus-visible{outline:2px solid #555;outline-offset:1px} .canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:#fff} .canvas-wrap.dragging{cursor:grabbing}canvas{display:block;width:100%;height:100%}.tip{position:absolute;left:12px;bottom:12px;font-size:12px;background:#fff;border:1px solid #bbb;padding:6px 10px;max-width:calc(100% - 24px);pointer-events:none}.zoom{font-size:12px;border:1px solid #ddd;padding:8px 9px;font-variant-numeric:tabular-nums} @media (max-width:700px){.brand{width:100%;margin-right:0}.bar{padding:8px;gap:6px}.search{flex:1 1 130px;min-width:0}.tip{font-size:11px}.zoom{display:none}}
@media print{.bar,.tip{display:none}#app{height:auto} .canvas-wrap{height:auto;overflow:visible}canvas{width:100%;height:auto}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="brand">生物医学工程 · 就业全景图（纯黑白）</span>
    <input class="search" id="search" placeholder="搜索行业或岗位，如：工艺、算法" aria-label="搜索行业或岗位">
    <button id="all" class="active">全部岗位</button>
    <button id="bachelor">本科可投</button>
    <button id="graduate">硕博方向</button>
    <button id="fit">适配画面</button>
    <button id="plus">放大 +</button>
    <button id="minus">缩小 −</button>
    <button id="download">保存 PNG</button>
    <span class="zoom" id="zoom">100%</span>
  </div>
  <div class="canvas-wrap" id="wrap"><canvas id="board"></canvas><div class="tip">鼠标滚轮缩放 · 拖动移动 · 双指缩放 · 可按学历筛选 · 保存高清PNG</div></div>
</div>
<script>

 ]},

  {name:'销售 / 市场 / 商务',jobs:['技术销售 / FAE|本','医疗器械销售|本','市场 / 产品专员|本','商务拓展(BD)|本','招投标专员|本','专业教育专员|本']},
  {name:'供应链 / 质量 / 运营',jobs:['采购 / 供应链专员|本','供应商质量(SQE)|本','生产计划专员|本','质量管理专员|本','数据 / 用户 / AI运营|本']}

];
const canvas=document.getElementById('board'), wrap=document.getElementById('wrap');
const buttons={all:document.getElementById('all'), bachelor:document.getElementById('bachelor'), graduate:document.getElementById('graduate')};
let filter='all',query='',layout=null,world={w:4000,h:3300},scale=1,offset={x:0,y:0},lastViewport={w:0,h:0};
const COLORS={ink:'#111',light:'#888',faint:'#ddd'};
function f(ctx,size=26,bold=false){ctx.font=`${bold?700:400} ${size}px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif`}
function m(ctx,s){return ctx.measureText(s).width}
function qualified(job){const d=job.split('|')[1]||''; if(filter==='bachelor'&&!d.includes('本'))return false;if(filter==='graduate'&&!d.includes('硕')&&!d.includes('博'))return false;return true}
function getFiltered(){return data.map(g=>({...g,sections:g.sections.map(s=>({...s,jobs:s.jobs.filter(j=>qualified(j)&&(!query||j.includes(query)||s.name.includes(query)||g.title.includes(query)))})).filter(s=>s.jobs.length)})).filter(g=>g.sections.length)}
function packJobs(ctx,jobs,maxWidth){
 f(ctx,24);let lines=[],parts=[];let curr='',w=0;
 for(let job of jobs){let [name,degree]=job.split('|');let text=name+(degree?`〔${degree}〕`:'');let token=(curr?'  ·  ':'')+text;
  if(curr && m(ctx,curr+token)>maxWidth){lines.push(curr);curr=text}else{curr+=token}
 }
 if(curr) lines.push(curr);
 return lines;
}
function measureLayout(){
 const off=document.createElement('canvas').getContext('2d');
 const groups=getFiltered();const left=groups.filter(g=>g.side==='L'),right=groups.filter(g=>g.side==='R');
 const W=4000, margin=95, gutter=275, cardW=(W-margin*2-gutter)/2, xL=margin,xR=W-margin-cardW;
 function card(g,x){const sec=[];let total=104;
  for(const s of g.sections){const lines=packJobs(off,s.jobs,cardW-350);const h=Math.max(68,lines.length*36+24);sec.push({...s,lines,h});total+=h+13}
  total+=18;return {...g,sections:sec,w:cardW,x,h:total};
 }
 let curL=300,curR=300,gap=60;
 const gl=left.map(g=>{const r=card(g,xL);r.y=curL;curL+=r.h+gap;return r});
 const gr=right.map(g=>{const r=card(g,xR);r.y=curR;curR+=r.h+gap;return r});
 const H=Math.max(curL,curR)+140;
 return {groups:[...gl,...gr],W,H,centerX:W/2,cardW};
}
function text(ctx,t,x,y,size=24,bold=false,color=COLORS.ink){ctx.save();f(ctx,size,bold);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()}
function path(ctx,points,width=2,stroke=COLORS.ink){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}
function drawWorld(ctx){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,world.w,world.h);
 const {groups,centerX,W,H}=layout;
 text(ctx,'生物医学工程  /  就业行业全景思维导图',W/2-575,89,43,true);
 path(ctx,[[160,121],[W-160,121]],2);
 text(ctx,'按行业 → 细分赛道 → 岗位排序   ·   删除重复描述，只保留可投方向与学历标签',W/2-600,172,25);
 // the central vertical tree trunk
 path(ctx,[[centerX,225],[centerX,H-136]],2);
 ctx.fillStyle='#fff';ctx.strokeStyle=COLORS.ink;ctx.lineWidth=3;ctx.strokeRect(centerX-126,221,252,73);
 text(ctx,'生物医学工程',centerX-106,270,29,true);
 for(const g of groups){
  const cy=g.y+45, isL=g.side==='L', bx=isL?g.x+g.w:g.x;
  ctx.beginPath();ctx.moveTo(centerX,cy);ctx.bezierCurveTo(centerX+(isL?-80:80),cy, bx+(isL?85:-85),cy, bx,cy);ctx.lineWidth=2.2;ctx.strokeStyle=COLORS.ink;ctx.stroke();
  ctx.fillStyle='#fff';ctx.strokeStyle=COLORS.ink;ctx.lineWidth=2.3;ctx.strokeRect(g.x,g.y,g.w,g.h);
  // small black square card marker
  ctx.fillStyle=COLORS.ink;ctx.fillRect(g.x+28,g.y+25,14,14);
  text(ctx,g.title,g.x+56,g.y+49,33,true);
  path(ctx,[[g.x+26,g.y+73],[g.x+g.w-26,g.y+73]],1.2);
  let y=g.y+107;
  for(let si=0;si<g.sections.length;si++){
   const s=g.sections[si];const nameX=g.x+33, descX=g.x+315;
   text(ctx,s.name,nameX,y+20,24,true);
   ctx.fillStyle=COLORS.ink;ctx.fillRect(nameX-3,y-3,4,25);
   for(let i=0;i<s.lines.length;i++)text(ctx,s.lines[i],descX,y+20+i*36,24,false);
   y+=s.h+13;
   if(si<g.sections.length-1)path(ctx,[[g.x+28,y-7],[g.x+g.w-28,y-7]],1,COLORS.faint);
  }
 }
 path(ctx,[[160,H-101],[W-160,H-101]],1.8);
 text(ctx,'学历：〔本〕本科常见可投   〔硕〕硕士常见/更有优势   〔博〕博士偏研究   │   本/硕表示两个学历层次均可能有机会',175,H-60,25);
 text(ctx,'说明：学历为求职导航，不等于企业必然接受生医工专业；跨半导体、IT、药研等岗位须满足课程、技能、经验及招聘条件。',175,H-20,23);
}
function viewport(){const r=wrap.getBoundingClientRect();return {w:r.width,h:r.height}}
function draw(){const v=viewport(),dpr=Math.min(window.devicePixelRatio||1,2);const pixelW=Math.max(2,Math.round(v.w*dpr)),pixelH=Math.max(2,Math.round(v.h*dpr));if(canvas.width!==pixelW||canvas.height!==pixelH){canvas.width=pixelW;canvas.height=pixelH}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,v.w,v.h);ctx.save();ctx.translate(offset.x,offset.y);ctx.scale(scale,scale);drawWorld(ctx);ctx.restore();document.getElementById('zoom').textContent=Math.round(scale*100)+'%'}
function fit(){const v=viewport(),pad=30;scale=Math.min((v.w-pad*2)/world.w,(v.h-pad*2)/world.h);offset={x:(v.w-world.w*scale)/2,y:(v.h-world.h*scale)/2};draw()}
function rebuild(){layout=measureLayout();world={w:layout.W,h:layout.H};fit()}
function zoomAt(factor,x,y){const next=Math.max(.08,Math.min(2.7,scale*factor));const k=next/scale;offset={x:x-(x-offset.x)*k,y:y-(y-offset.y)*k};scale=next;draw()}
function applyFilter(v){filter=v;for(const [name,btn] of Object.entries(buttons))btn.classList.toggle('active',name===v);rebuild()}
for(const [key,btn]of Object.entries(buttons))btn.addEventListener('click',()=>applyFilter(key));
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();rebuild()});
document.getElementById('fit').addEventListener('click',fit);
document.getElementById('plus').addEventListener('click',()=>{const v=viewport();zoomAt(1.3,v.w/2,v.h/2)});
document.getElementById('minus').addEventListener('click',()=>{const v=viewport();zoomAt(1/1.3,v.w/2,v.h/2)});
document.getElementById('download').addEventListener('click',()=>{
 const out=document.createElement('canvas');const factor=1.4;out.width=Math.round(world.w*factor);out.height=Math.round(world.h*factor);const ctx=out.getContext('2d');ctx.scale(factor,factor);drawWorld(ctx);const a=document.createElement('a');a.download='生物医学工程就业全景图_黑白版.png';a.href=out.toDataURL('image/png');a.click();
});
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0014),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let pointers=new Map(),prevDist=null;
wrap.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});wrap.setPointerCapture(e.pointerId);wrap.classList.add('dragging')});
wrap.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){offset.x+=e.clientX-p.x;offset.y+=e.clientY-p.y;draw()}
 else if(pointers.size===2){const pair=[...pointers.values()],d=Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);if(prevDist){const r=wrap.getBoundingClientRect();zoomAt(d/prevDist,(pair[0].x+pair[1].x)/2-r.left,(pair[0].y+pair[1].y)/2-r.top)}prevDist=d}
});
for(const event of ['pointerup','pointercancel'])wrap.addEventListener(event,e=>{pointers.delete(e.pointerId);prevDist=null;if(!pointers.size)wrap.classList.remove('dragging')});
window.addEventListener('resize',()=>{const now=viewport();if(Math.abs(now.w-lastViewport.w)>4||Math.abs(now.h-lastViewport.h)>4){lastViewport=now;fit()}});
