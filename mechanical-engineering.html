<script>

byId('summary').textContent=DATA.summary||'';

let term='',degree='全部',mode='list',selected=null,scale=1,ox=0,oy=0,mapNodes=[],pointer=null,lastPx=null;
const fits=r=>degree==='全部'||r.min_degree===degree||(degree==='硕'&&r.min_degree==='本')||(degree==='博'&&['本','硕','博'].includes(r.min_degree));
const matches=(r,i,t)=>fits(r)&&(!term||(r.title+' '+(r.skills||[]).join(' ')+' '+i+' '+t).toLowerCase().includes(term));
const showCount=i=>i.tracks.reduce((sum,t)=>sum+t.roles.filter(r=>matches(r,i.name,t.name)).length,0);
const textNode=(tag,content,clazz='')=>{const e=document.createElement(tag);e.textContent=content;if(clazz)e.className=clazz;return e;};
function renderList(){const nav=byId('nav');const sections=byId('sections');nav.replaceChildren();sections.replaceChildren();let shown=0;
 DATA.industries.forEach((industry,idx)=>{const count=showCount(industry);if(!count)return;shown+=count;const id='industry-'+idx;const l=textNode('a',industry.name+' · '+count);l.href='#'+id;nav.appendChild(l);const article=textNode('article','', 'chapter');article.id=id;article.appendChild(textNode('h2',String(idx+1).padStart(2,'0')+' · '+industry.name));article.appendChild(textNode('p',industry.tracks.length+' 个细分方向 · '+count+' 个可查看岗位','counts'));
 industry.tracks.forEach(track=>{const hits=track.roles.filter(r=>matches(r,industry.name,track.name));if(!hits.length)return;const block=textNode('section','','track');block.appendChild(textNode('h3',track.name+'  /  '+hits.length+' 岗'));const grid=textNode('div','','rolegrid');hits.forEach(r=>{const box=textNode('div','','role');const left=textNode('div');left.appendChild(textNode('div',r.title));if(r.skills&&r.skills.length)left.appendChild(textNode('small','技能：'+r.skills.slice(0,4).join(' / ')));const badges=textNode('div','','tags');badges.appendChild(textNode('span',r.min_degree+'起','tag'));if(r.fit==='转型')badges.appendChild(textNode('span','补技能','tag fit'));if(r.fit==='跨行业')badges.appendChild(textNode('span','跨行业','tag fit'));box.append(left,badges);grid.appendChild(box)});block.appendChild(grid);
 const ids=[...new Set(hits.flatMap(r=>r.source_ids||[]))];if(ids.length){const src=document.createElement('div');for(const id of ids.slice(0,6)){const s=DATA.sources.find(z=>z.id===id);if(!s)continue;const a=textNode('a','参考：'+s.title,'source');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';src.appendChild(a)}block.appendChild(src)}article.appendChild(block)});sections.appendChild(article) });if(!shown)sections.appendChild(textNode('p','无匹配岗位，请尝试其他关键词或学历筛选。','empty'));
}
function setMode(value){mode=value;byId('listView').classList.toggle('active',mode==='list');byId('canvasView').classList.toggle('active',mode==='canvas');document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));if(mode==='canvas')requestAnimationFrame(()=>resetView())}
function rounded(ctx,x,y,w,h,r=9){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function hitSector(x,y){return mapNodes.find(n=>x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h)}
function viewData(){if(selected===null){const inds=DATA.industries.map((industry,id)=>({industry,id,count:showCount(industry)})).filter(o=>o.count>0);const left=inds.filter((_,i)=>i%2===0),right=inds.filter((_,i)=>i%2===1);const rowH=104;const rows=Math.max(left.length,right.length);const H=Math.max(590,rows*rowH+150),W=2200,cx=W/2,cy=H/2;const nodes=[];for(const [side,arr] of [[-1,left],[1,right]])arr.forEach((o,i)=>{const y=(H-arr.length*rowH)/2+i*rowH;nodes.push({id:o.id,x:side<0?315:1515,y,w:370,h:73,name:o.industry.name,count:o.count,side})});return {W,H,cx,cy,nodes,root:DATA.major,detail:false}}
 const industry=DATA.industries[selected];const tracks=industry.tracks.map((t,id)=>({track:t,id,roles:t.roles.filter(r=>matches(r,industry.name,t.name))})).filter(t=>t.roles.length>0);const left=tracks.filter((_,i)=>i%2===0),right=tracks.filter((_,i)=>i%2===1);const calcHeight=o=>Math.max(110,52+Math.min(o.roles.length,80)*26);let leftH=left.reduce((s,o)=>s+calcHeight(o)+19,0),rightH=right.reduce((s,o)=>s+calcHeight(o)+19,0);const H=Math.max(660,Math.max(leftH,rightH)+110),W=2600,cx=W/2,cy=H/2,nodes=[];for(const [side,arr] of [[-1,left],[1,right]]){let y=(H-arr.reduce((s,o)=>s+calcHeight(o)+19,0))/2;arr.forEach(o=>{const h=calcHeight(o),w=620,x=side<0?165:1815;nodes.push({id:o.id,x,y,w,h,name:o.track.name,count:o.roles.length,roles:o.roles,side});y+=h+19})}return {W,H,cx,cy,nodes,root:industry.name,detail:true}
}
function resetView(){const v=viewData();const rect=byId('mapwrap').getBoundingClientRect();scale=Math.max(.23,Math.min(rect.width/v.W,rect.height/v.H)*.93);ox=(rect.width-v.W*scale)/2;oy=(rect.height-v.H*scale)/2;draw()}
function draw(){if(mode!=='canvas')return;const c=byId('map'),frame=byId('mapwrap'),rect=frame.getBoundingClientRect();if(rect.width===0||rect.height===0)return;const dpr=Math.min(window.devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,rect.width,rect.height);ctx.translate(ox,oy);ctx.scale(scale,scale);const v=viewData();mapNodes=v.nodes;
 ctx.strokeStyle='#bdbdbd';ctx.lineWidth=2.3;for(const n of v.nodes){const a=v.cx+(n.side<0?-125:125),x=n.side<0?n.x+n.w:n.x,mid=n.y+n.h/2;ctx.beginPath();ctx.moveTo(a,v.cy);ctx.bezierCurveTo((a+x)/2,v.cy,(a+x)/2,mid,x,mid);ctx.stroke()}
 ctx.fillStyle='#161616';rounded(ctx,v.cx-125,v.cy-52,250,104,10);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 25px sans-serif';ctx.fillText(v.root.length>12?v.root.slice(0,11)+'…':v.root,v.cx,v.cy+8,225);ctx.textAlign='left';
 for(const n of v.nodes){rounded(ctx,n.x,n.y,n.w,n.h,8);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#303030';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#111';ctx.font='700 22px sans-serif';ctx.fillText(n.name.length>27?n.name.slice(0,26)+'…':n.name,n.x+20,n.y+35);ctx.font='15px sans-serif';ctx.fillStyle='#666';ctx.fillText(n.count+' 个岗位'+(v.detail?'':'  · 点击查看'),n.x+20,n.y+58);if(v.detail){let yy=n.y+88;ctx.font='16px sans-serif';const max=Math.floor((n.h-82)/26);for(const r of n.roles.slice(0,max)){ctx.fillStyle='#272727';const label='· '+r.title+'  ['+r.min_degree+']';ctx.fillText(label.length>47?label.slice(0,46)+'…':label,n.x+21,yy);yy+=26}if(n.roles.length>max){ctx.fillStyle='#777';ctx.fillText('…其余岗位请见「岗位目录」',n.x+22,n.y+n.h-15)}}}
 byId('mapStatus').textContent=v.detail?('当前：'+v.root+' · '+v.nodes.length+' 个细分方向；点击「返回行业总览」切换'):('当前：'+DATA.major+' · '+v.nodes.length+' 个行业；点击行业节点查看详细岗位')}
function locate(e){const rect=byId('map').getBoundingClientRect();return {x:(e.clientX-rect.left-ox)/scale,y:(e.clientY-rect.top-oy)/scale}}
const canvas=byId('map');canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,startX:e.clientX,startY:e.clientY,ox,oy,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dx=e.clientX-pointer.startX,dy=e.clientY-pointer.startY;pointer.moved=Math.hypot(dx,dy)>7;ox=pointer.ox+dx;oy=pointer.oy+dy;draw()});canvas.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;const moved=pointer.moved;pointer=null;if(!moved&&selected===null){const n=hitSector(locate(e).x,locate(e).y);if(n){selected=n.id;resetView()}}});canvas.addEventListener('wheel',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;const old=scale;scale=Math.max(.16,Math.min(2.8,scale*(e.deltaY<0?1.15:.87)));ox=mx-(mx-ox)*scale/old;oy=my-(my-oy)*scale/old;draw()},{passive:false});
byId('backOverview').onclick=()=>{selected=null;resetView()};byId('fitCanvas').onclick=resetView;byId('exportCanvas').onclick=()=>{const c=byId('map');const link=document.createElement('a');link.download=DATA.slug+'-'+(selected===null?'industries':'detail')+'.png';link.href=c.toDataURL('image/png');link.click()};
document.querySelectorAll('button[data-filter]').forEach(b=>b.addEventListener('click',()=>{degree=b.dataset.filter;document.querySelectorAll('button[data-filter]').forEach(z=>z.setAttribute('aria-pressed',String(z===b)));renderList();selected=null;if(mode==='canvas')resetView()}));document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));byId('search').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();renderList();selected=null;if(mode==='canvas')resetView()});window.addEventListener('resize',()=>{if(mode==='canvas')resetView()});renderList();
})();
